name: Terraform Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - dev
      - stage

  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      artifact_key:
        description: "S3 key of artifact to deploy"
        required: true

permissions:
  contents: read
  id-token: write


jobs:

# resolving the environment


  resolve-environment:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
     environment: ${{ steps.set-env.outputs.environment }}

    steps:
    - name: Resolve environment
      id: set-env
      run: |
        # Case 1: PR merged (dev or stage)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          if [[ "${{ github.base_ref }}" == "dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "stage" ]]; then
            echo "environment=stage" >> $GITHUB_OUTPUT
          fi

        # Case 2: Tag push (prod)
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
        fi

      # adding detect-changes job  
   
  
  detect-changes:
    runs-on: ubuntu-latest
    needs: resolve-environment

    outputs:
      lambda_changed: ${{ steps.filter.outputs.lambda }}
      api_changed: ${{ steps.filter.outputs.api }}
      networking_changed: ${{ steps.filter.outputs.networking }}
      bastion_changed: ${{ steps.filter.outputs.bastion }}
      database_changed: ${{ steps.filter.outputs.database }}
      iam_changed: ${{ steps.filter.outputs.iam }}
      s3_changed: ${{ steps.filter.outputs.s3 }}
      cloudfront_changed: ${{ steps.filter.outputs.cloudfront }}
      logging_changed: ${{ steps.filter.outputs.logging }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lambda:
              - 'lambda/**'
              - 'modules/lambda/**'
              - 'environments/**/lambda/**'

            api:
              - 'modules/api/**'
              - 'environments/**/api/**'

            networking:
              - 'modules/networking/**'
              - 'environments/**/networking/**'

            bastion:
              - 'modules/bastion/**'
              - 'environments/**/bastion/**'

            database:
              - 'modules/database/**'
              - 'environments/**/database/**'

            iam:
              - 'modules/iam/**'
              - 'environments/**/iam/**'

            s3:
              - 'modules/s3/**'
              - 'environments/**/s3/**'
              - 'website/**'

            cloudfront:
              - 'modules/cloudfront/**'
              - 'environments/**/cloudfront/**'

            logging:
              - 'modules/logging/**'
              - 'environments/**/logging/**' 


    # building .zip and uploading lambda artifact


  build-lambda:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.lambda_changed == 'true'
        
      )

    needs: [resolve-environment, detect-changes]
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-environment.outputs.environment }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
         rm -rf lambda/package
         mkdir -p lambda/package
         pip install -r lambda/requirements.txt -t lambda/package

      - name: Copy source files
        run: |
         cp -r lambda/src/* lambda/package/

      - name: Create Lambda zip
        run: |
         cd lambda/package
         zip -r ../lambda.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to S3
        run: |
          ENV_NAME=${{ needs.resolve-environment.outputs.environment }}
          aws s3 cp lambda/lambda.zip \
          s3://${{ vars.LAMBDA_ARTIFACT_BUCKET }}/${ENV_NAME}/${{ github.sha }}.zip        
  

   

   # creating dependencies for ordered deployment


  networking:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.networking_changed == 'true'
        
      )
    needs: [resolve-environment, detect-changes] 
    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: networking
      action: apply


   # bastion job

  bastion:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.bastion_changed == 'true' ||
        needs.detect-changes.outputs.networking_changed == 'true'
        
      )    
    needs: [networking, resolve-environment, detect-changes]
    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: bastion
      action: apply
      

  iam:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.iam_changed == 'true'
     
      )

    needs: [resolve-environment, detect-changes]
    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: iam
      action: apply


  database:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.database_changed == 'true' ||
        needs.detect-changes.outputs.networking_changed == 'true' ||
        needs.detect-changes.outputs.iam_changed == 'true' ||
        needs.detect-changes.outputs.bastion_changed == 'true'
     
      )
    needs: [iam, networking, bastion, resolve-environment, detect-changes]

    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: database
      action: apply


  s3:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.s3_changed == 'true' 
     
      )

    needs: [resolve-environment, detect-changes]

    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: s3
      action: apply
  

  frontend:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.s3_changed == 'true' 
     
      )
        
    needs: [s3, resolve-environment, detect-changes]
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-environment.outputs.environment }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PIPELINE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload frontend to S3
        run: |
          ENV_NAME=${{ needs.resolve-environment.outputs.environment }}

          aws s3 sync website/ \
          s3://${{ vars.FRONTEND_BUCKET_NAME }} \
          --delete


  lambda:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.lambda_changed == 'true' ||
        needs.detect-changes.outputs.database_changed == 'true' ||
        needs.detect-changes.outputs.networking_changed == 'true' ||
        needs.detect-changes.outputs.iam_changed == 'true'
     
      )
    needs: [build-lambda, s3, iam, networking, database, resolve-environment, detect-changes]

    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: lambda
      action: apply


  api_gateway:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.lambda_changed == 'true' ||
        needs.detect-changes.outputs.api_changed == 'true'
     
      )
    needs: [lambda, resolve-environment, detect-changes]

    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: api
      action: apply


  cloudfront:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.cloudfront_changed == 'true' ||
        needs.detect-changes.outputs.s3_changed == 'true' ||
        needs.detect-changes.outputs.api_changed == 'true'
     
      )
    needs: [api_gateway, s3, resolve-environment, detect-changes]

    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: cloudfront
      action: apply


  logging:
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.merged == true ||
        startsWith(github.ref, 'refs/tags/')
      )
      &&
      (
        needs.detect-changes.outputs.logging_changed == 'true' 
      )   

    needs: [resolve-environment, detect-changes]

    uses: ./.github/workflows/terraform-component.yml
    with:
      environment: ${{ needs.resolve-environment.outputs.environment }}
      component: cloudfront
      action: apply  